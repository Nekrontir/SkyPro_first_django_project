{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <div class="row">
    <div class="col-lg-8 mx-auto">
      <h1>{{ blog_post.title }}</h1>
      <p class="text-muted">
        Создано: {{ blog_post.created_at|date:"d.m.Y" }} |
        Просмотров: {{ blog_post.views_count }}
      </p>
      {% if blog_post.preview %}
      <img src="{{ blog_post.preview.url }}" class="img-fluid rounded mb-4" alt="{{ blog_post.title }}">
      {% endif %}
      <div class="content">
        {{ blog_post.content|linebreaks }}
      </div>
      <div class="mt-4">
        <a href="{% url 'blog:blog_update' blog_post.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'blog:blog_delete' blog_post.pk %}" class="btn btn-danger">Удалить</a>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Назад к списку</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
